name: Deploy to IONOS

on:
  push:
    branches:
      - Master  # O la rama que prefieras desplegar

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # Paso 2: Configurar la clave SSH
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H home496960781.1and1-data.host >> ~/.ssh/known_hosts

      # Paso 3: Subir los archivos al servidor
      - name: Deploy to server via SFTP
        run: |
          rsync -avz --delete ./ acc1831091850:/108LMSGIProyectoLMSGI
