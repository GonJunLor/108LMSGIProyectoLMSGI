<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
</head>
<body>
    <form id="formulario2" method="get" action="#valida.php">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre">
        </div><br>
        <div>
            <label for="masculino">Genero: </label>
            <input type="radio" name="genero" id="masculino" value="Masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" name="genero" id="femenino" value="Femenino">
            <label for="masculino">Femenino</label>
        </div><br>
        <div>
            <label for="paises">Paises:</label>
            <select name="paises" id="paises">
                <option value="España">España</option>
                <option value="Portugal">Portugal</option>
                <option value="Francia">Francia</option>
            </select>
        </div><br>
        <div>
            <label for="mensaje">Mensaje:</label><br>
            <textarea name="mensaje" id="mensaje" rows="4" cols="30"></textarea>
        </div><br>
        <div>
            <input type="checkbox" name="suscribirse" id="suscribirse">
            <label for="suscribirse">Suscribirse?</label>
        </div><br>
        <input type="submit">
    </form>
</body>
</html>
